<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Am uitat parola - vanzator</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>Am uitat parola</h1>
  <p>Introdu emailul contului tau de vanzator. Daca exista un cont cu acest email, vei primi un link de resetare.</p>
</header>
<main>
  <div class="question-card">
    <div id="feedback"></div>
    <form id="forgot-form">
      <label>Email</label>
      <input type="email" name="email" required style="width:100%;padding:10px;margin:6px 0 18px;border-radius:8px;border:1px solid #2a2e38;background:#10131a;color:#e8eaed;" />
      <button type="submit">Trimite link de resetare</button>
    </form>
    <p style="text-align:center;margin-top:16px;color:#9aa0ab;font-size:0.9rem;">
      <a href="/vanzator/login.html" style="color:#6c8cff;">Inapoi la autentificare</a>
    </p>
  </div>
</main>
<script>
document.getElementById('forgot-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const button = form.querySelector('button');
  const fb = document.getElementById('feedback');
  button.disabled = true;
  button.textContent = 'Se trimite...';
  try {
    const res = await fetch('/api/vanzator/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: form.email.value }),
    });
    const data = await res.json();
    fb.innerHTML = `<div class="notice">${data.message || 'Daca exista un cont cu acest email, vei primi un link de resetare.'}</div>`;
    form.style.display = 'none';
  } catch (err) {
    fb.innerHTML = '<div class="notice error">Eroare de retea. Incearca din nou.</div>';
    button.disabled = false;
    button.textContent = 'Trimite link de resetare';
  }
});
</script>
</body>
</html>
