<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Devino vanzator — creeaza cont</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>Devino vanzator</h1>
  <p>Inregistrarile de vanzatori noi sunt inchise. Acesta este magazinul unui singur vanzator.</p>
</header>
<main>
  <div class="question-card">
    <div id="feedback"></div>
    <form id="reg-form">
      <label>Nume afacere / nume tau</label>
      <input type="text" name="name" required style="width:100%;padding:10px;margin:6px 0 14px;border-radius:8px;border:1px solid #2a2e38;background:#10131a;color:#e8eaed;" />
      <label>Email</label>
      <input type="email" name="email" required style="width:100%;padding:10px;margin:6px 0 14px;border-radius:8px;border:1px solid #2a2e38;background:#10131a;color:#e8eaed;" />
      <label>Parola (minim 8 caractere)</label>
      <input type="password" name="password" minlength="8" required style="width:100%;padding:10px;margin:6px 0 18px;border-radius:8px;border:1px solid #2a2e38;background:#10131a;color:#e8eaed;" />
      <button type="submit">Creeaza cont</button>
    </form>
    <p style="text-align:center;margin-top:16px;color:#9aa0ab;font-size:0.9rem;">
      Ai deja cont? <a href="/vanzator/login.html" style="color:#6c8cff;">Autentifica-te</a>
    </p>
  </div>
</main>
<footer>
  Prin crearea contului confirmi ca produsele tale sunt legale si ca ai dreptul sa le vinzi.
</footer>
<script>
document.getElementById('reg-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target; document.getElementById('feedback').innerHTML = '<div class="notice error">Inregistrarile de vanzatori noi sunt inchise. Acesta este magazinul unui singur vanzator.</div>'; return;
  const button = form.querySelector('button');
  button.disabled = true;
  button.textContent = 'Se creeaza contul...';
  const body = {
    name: form.name.value,
    email: form.email.value,
    password: form.password.value,
  };
  try {
    const res = await fetch('/api/vanzator/inregistrare', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (data.ok) {
      location.href = '/vanzator/dashboard.html';
    } else {
      document.getElementById('feedback').innerHTML = `<div class="notice error">${data.error || 'Eroare la inregistrare.'}</div>`;
      button.disabled = false;
      button.textContent = 'Creeaza cont';
    }
  } catch (err) {
    document.getElementById('feedback').innerHTML = '<div class="notice error">Eroare de retea. Incearca din nou.</div>';
    button.disabled = false;
    button.textContent = 'Creeaza cont';
  }
});
</script>
</body>
</html>
