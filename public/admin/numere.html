<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin - numere produs</title>
<link rel="stylesheet" href="/style.css" />
<style>
  .top-bar { max-width:1100px; margin: 0 auto; padding: 16px 24px 0; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .top-bar button { width:auto; padding:7px 16px; font-size:0.85rem; border-radius:8px; }
  .top-bar .nav-links { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .top-bar .nav-links a { color:#6c8cff; font-size:0.9rem; text-decoration:none; transition:color 0.15s ease; }
  .top-bar .nav-links a:hover { color:#a7b8ff; }
  main { max-width: 1100px; }

  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; }
  @media (max-width: 480px) { .panel { padding:18px; } }

  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:20px; max-width:420px; }
  .field label { font-size:0.78rem; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; }
  .field select { width:100%; padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:#10131a; color:var(--text); font-size:0.95rem; }

  .search-box { display:flex; align-items:center; gap:8px; background:#10131a; border:1px solid var(--border); border-radius:12px; padding:5px 6px 5px 14px; margin-bottom:18px; transition:border-color 0.15s ease; }
  .search-box:focus-within { border-color: var(--accent); }
  .search-box svg { flex-shrink:0; }
  .search-box input { flex:1; min-width:0; border:none; background:transparent; color:var(--text); padding:11px 4px; font-size:0.95rem; outline:none; }
  .search-box input::placeholder { color: var(--muted); }
  .search-box button { width:auto; padding:11px 20px; border-radius:9px; flex-shrink:0; }

  .notice-mini { padding:12px 14px; border-radius:10px; font-size:0.88rem; margin-bottom:18px; background:#1c2333; border:1px solid #2f3a55; color:#b7c3ff; }
  .notice-mini.warn { background:#332a1c; border-color:#55461f; color:#ffd791; }

  .winner-card { display:flex; gap:16px; align-items:flex-start; background:linear-gradient(135deg, rgba(53,194,107,0.14), rgba(108,140,255,0.08)); border:1px solid rgba(53,194,107,0.4); border-radius:14px; padding:20px; margin-bottom:18px; }
  @media (max-width:480px) { .winner-card { flex-direction:column; padding:16px; } }
  .winner-icon { font-size:1.9rem; line-height:1; }
  .winner-body { flex:1; min-width:0; }
  .winner-title { font-weight:700; font-size:1.05rem; margin-bottom:12px; color:#eafff0; }
  .winner-row { display:flex; align-items:center; flex-wrap:wrap; gap:8px; font-size:0.9rem; margin-bottom:7px; }
  .winner-label { color:var(--muted); min-width:92px; font-size:0.82rem; text-transform:uppercase; letter-spacing:0.03em; }
  .winner-row code { background:#10131a; padding:4px 10px; border-radius:6px; font-size:0.85rem; }
  .winner-row button { width:auto; padding:5px 13px; font-size:0.76rem; border-radius:7px; }
  .winner-meta { color:var(--muted); font-size:0.8rem; margin-top:10px; }

  .stats-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(110px, 1fr)); gap:10px; margin-bottom:14px; }
  .stat-card { background:#10131a; border:1px solid var(--border); border-radius:12px; padding:14px 10px; text-align:center; }
  .stat-card .stat-value { font-size:1.45rem; font-weight:700; }
  .stat-card.sold .stat-value { color: var(--good); }
  .stat-card.free .stat-value { color: var(--bad); }
  .stat-card .stat-label { color:var(--muted); font-size:0.72rem; margin-top:3px; text-transform:uppercase; letter-spacing:0.04em; }

  .progress-bar { height:8px; border-radius:6px; background:#20242e; overflow:hidden; margin-bottom:6px; }
  .progress-fill { height:100%; background: linear-gradient(90deg, var(--accent), var(--good)); border-radius:6px; transition:width 0.4s ease; }
  .progress-label { font-size:0.8rem; color:var(--muted); margin-bottom:18px; }

  .legend { display:flex; gap:18px; font-size:0.82rem; color:var(--muted); margin-bottom:14px; flex-wrap:wrap; }
  .legend-item { display:flex; align-items:center; gap:6px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .dot.green { background: var(--good); }
  .dot.red { background: var(--bad); }

  .numbers-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(46px, 1fr)); gap:8px; }
  .num-chip { border:none; border-radius:10px; padding:10px 0; font-size:0.8rem; font-weight:700; cursor:default; transition:transform 0.12s ease, box-shadow 0.12s ease; font-family:inherit; }
  .num-chip.achizitionat { background:rgba(53,194,107,0.15); color:#8df0b0; box-shadow:inset 0 0 0 1px rgba(53,194,107,0.35); }
  .num-chip.liber { background:rgba(255,92,92,0.08); color:#ff9d9d; box-shadow:inset 0 0 0 1px rgba(255,92,92,0.25); }
  .num-chip:hover { transform:scale(1.08); }
  .num-chip.cautat { outline: 3px solid #ffd166; outline-offset: 2px; }
</style>
</head>
<body>
<div class="top-bar">
  <strong>Panou administrator</strong>
  <div class="nav-links">
    <a href="/admin/index.html">Dashboard</a>
    <a href="/admin/comenzi.html">Toate comenzile</a>
    <a href="/admin/vanzatori.html">Vanzatori</a>
    <a href="/admin/whatsapp.html">Mesaje WhatsApp</a>
    <button id="logout-btn">Delogare</button>
  </div>
</div>
<header>
  <h1 id="titlu">Numere produs</h1>
  <p>Toate numerele posibile ale produsului si cautare rapida a castigatorului dupa numar de bilet.</p>
</header>
<main>
  <div class="panel">
    <div class="field">
      <label for="product-select">Produs</label>
      <select id="product-select"><option>Se incarca...</option></select>
    </div>

    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9aa0ab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="search-number" type="number" min="1" placeholder="Cauta castigatorul dupa numar de bilet (ex: 42)" />
      <button id="search-btn" type="button">Cauta</button>
    </div>
    <div id="search-result"></div>

    <div id="content">Se incarca...</div>
  </div>
</main>

<script src="/common.js"></script>
<script>
let lastNumbers = [];
function currentId() {
  return new URLSearchParams(location.search).get('id');
}

async function loadProductSelect() {
  const res = await fetch('/api/admin/produse');
  if (res.status === 401) { location.href = '/admin/login.html'; return; }
  const products = await res.json();
  const sel = document.getElementById('product-select');
  const id = currentId();
  if (!products.length) {
    sel.innerHTML = '<option>Nu exista produse</option>';
    return;
  }
  sel.innerHTML = products.map(p => `<option value="${p.id}" ${p.id === id ? 'selected' : ''}>${escapeHtml(p.name)} (${escapeHtml(p.sellerName)})</option>`).join('');
  if (!id) {
    location.href = '/admin/numere.html?id=' + encodeURIComponent(products[0].id);
  }
}

document.getElementById('product-select').addEventListener('change', (e) => {
  location.href = '/admin/numere.html?id=' + encodeURIComponent(e.target.value);
});

async function loadNumere() {
  const id = currentId();
  const el = document.getElementById('content');
  if (!id) {
    el.innerHTML = '<p style="color:#9aa0ab;">Alege un produs din lista de mai sus.</p>';
    return;
  }
  const res = await fetch(`/api/admin/produse/${encodeURIComponent(id)}/numere`);
  if (res.status === 401) { location.href = '/admin/login.html'; return; }
  if (res.status === 404) {
    el.innerHTML = '<p style="color:#9aa0ab;">Produs inexistent.</p>';
    return;
  }
  const data = await res.json();
  lastNumbers = data.numbers;
  document.getElementById('titlu').textContent = 'Numere - ' + data.product.name;

  const total = data.numbers.length;
  const achizitionate = data.numbers.filter(n => n.purchased).length;
  const libere = total - achizitionate;
  const pct = total ? Math.round((achizitionate / total) * 100) : 0;

  if (!total) {
    el.innerHTML = '<p style="color:#9aa0ab;">Acest produs nu are inca niciun numar in stoc.</p>';
    return;
  }

  el.innerHTML = `
    <div class="stats-row">
      <div class="stat-card sold">
        <div class="stat-value">${achizitionate}</div>
        <div class="stat-label">Achizitionate</div>
      </div>
      <div class="stat-card free">
        <div class="stat-value">${libere}</div>
        <div class="stat-label">Disponibile</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${total}</div>
        <div class="stat-label">Total numere</div>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">${pct}% vandute</div>
    <div class="legend">
      <span class="legend-item"><span class="dot green"></span>Achizitionat</span>
      <span class="legend-item"><span class="dot red"></span>Neachizitionat</span>
    </div>
    <div class="numbers-grid">
      ${data.numbers.map(n => {
        const title = n.purchased
          ? `Numar ${n.number} - ${n.buyerName ? escapeHtml(n.buyerName) : 'cumparator'}${n.buyerPhone ? ' - ' + escapeHtml(n.buyerPhone) : ''}`
          : `Numar ${n.number} - neachizitionat`;
        return `<button type="button" class="num-chip ${n.purchased ? 'achizitionat' : 'liber'}" data-number="${n.number}" title="${title}">${n.number}</button>`;
      }).join('')}
    </div>
  `;
}

function formatPurchasedAt(iso) {
  return new Date(iso + 'Z').toLocaleString('ro-RO');
}

function searchWinner() {
  const input = document.getElementById('search-number');
  const resultEl = document.getElementById('search-result');
  const raw = input.value.trim();
  const num = parseInt(raw, 10);
  document.querySelectorAll('.numbers-grid .num-chip.cautat').forEach((el) => el.classList.remove('cautat'));
  if (!raw || isNaN(num)) {
    resultEl.innerHTML = '<div class="notice-mini">Introdu un numar de bilet.</div>';
    return;
  }
  const entry = lastNumbers.find((n) => n.number === num);
  if (!entry) {
    resultEl.innerHTML = `<div class="notice-mini warn">Numarul ${num} nu exista pentru acest produs.</div>`;
    return;
  }
  if (!entry.purchased) {
    resultEl.innerHTML = `<div class="notice-mini warn">Numarul ${num} nu a fost inca achizitionat.</div>`;
    return;
  }
  resultEl.innerHTML = `
    <div class="winner-card">
      <div class="winner-icon">\u{1F3C6}</div>
      <div class="winner-body">
        <div class="winner-title">Castigator &mdash; bilet #${num}</div>
        <div class="winner-row"><span class="winner-label">Client</span><span>${escapeHtml(entry.buyerName || '-')}</span></div>
        <div class="winner-row"><span class="winner-label">Telefon</span><span>${escapeHtml(entry.buyerPhone || '-')}</span></div>
        <div class="winner-row">
          <span class="winner-label">ID comanda</span>
          <code id="winner-order-id">${escapeHtml(entry.orderId)}</code>
          <button type="button" id="copy-order-id">Copiaza</button>
        </div>
        <div class="winner-meta">Achizitionat la: ${entry.purchasedAt ? formatPurchasedAt(entry.purchasedAt) : '-'}</div>
      </div>
    </div>
  `;
  const copyBtn = document.getElementById('copy-order-id');
  if (copyBtn) {
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(entry.orderId).catch(() => {});
    });
  }
  const cell = document.querySelector(`.numbers-grid .num-chip[data-number="${num}"]`);
  if (cell) {
    cell.classList.add('cautat');
    cell.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

document.getElementById('search-btn').addEventListener('click', searchWinner);
document.getElementById('search-number').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); searchWinner(); }
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/admin/logout', { method: 'POST' });
  location.href = '/admin/login.html';
});

loadProductSelect();
loadNumere();
setInterval(loadNumere, 7000);
</script>
</body>
</html>
