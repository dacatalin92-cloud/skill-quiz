<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin - mesaje WhatsApp</title>
<link rel="manifest" href="/admin/manifest.json" />
<meta name="theme-color" content="#10131a" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="WA MaritaShow" />
<link rel="stylesheet" href="/style.css" />
<style>
  .top-bar { max-width:900px; margin: 0 auto; padding: 16px 24px 0; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .top-bar button { width:auto; padding:6px 14px; font-size:0.85rem; }
  .top-bar .nav-links { display:flex; align-items:center; gap:16px; }
  .top-bar .nav-links a { color:#6c8cff; font-size:0.9rem; }
  main { max-width: 900px; }
  .msg-list { display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  .msg-item { padding: 12px 14px; border:1px solid #2a2e38; border-radius:10px; background:#161a23; }
  .msg-item .phone { font-weight:600; color:#e8eaed; }
  .msg-item .time { color:#9aa0ab; font-size:0.78rem; float:right; }
  .msg-item .body { margin-top:6px; color:#c7cad1; white-space:pre-wrap; }
</style>
</head>
<body>
<div class="top-bar">
  <strong>Mesaje WhatsApp primite</strong>
  <div class="nav-links">
    <a href="/admin/comenzi.html">&larr; Comenzi</a>
    <button id="logout-btn">Delogare</button>
  </div>
</div>
<header>
  <h1>Mesaje WhatsApp</h1>
  <p>Raspunsurile clientilor la notificarile automate de produs nou (ultimele 300). Pagina se reincarca automat la fiecare 20 secunde.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;">
    <button id="push-btn" type="button" onclick="enableAdminPush()" style="width:auto;padding:10px 16px;">Activeaza notificari pe telefon</button>
    <button id="install-btn" type="button" onclick="installApp()" style="display:none;width:auto;padding:10px 16px;">Instaleaza aplicatia</button>
  </div>
  <div id="push-feedback" style="font-size:0.85rem;margin-top:6px;"></div>
</header>
<main>
  <div id="content" class="question-card">Se incarca...</div>
</main>

<script src="/common.js"></script>
<script>
async function load() {
  const res = await fetch('/api/admin/whatsapp-mesaje');
  if (res.status === 401) { location.href = '/admin/login.html'; return; }
  const messages = await res.json();
  const el = document.getElementById('content');
  if (!messages.length) {
    el.innerHTML = '<p style="color:#9aa0ab;">Nu a fost primit inca niciun mesaj.</p>';
    return;
  }
  el.innerHTML = `
    <div class="msg-list">
      ${messages.map((m) => `
        <div class="msg-item">
          <span class="time">${new Date(m.receivedAt + 'Z').toLocaleString('ro-RO')}</span>
          <span class="phone">+${escapeHtml(m.fromPhone)}</span>
          <div class="body">${escapeHtml(m.body)}</div>
        </div>
      `).join('')}
    </div>
  `;
}

document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/admin/logout', { method: 'POST' });
  location.href = '/admin/login.html';
});

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) {
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

async function enableAdminPush() {
  const btn = document.getElementById('push-btn');
  const fb = document.getElementById('push-feedback');
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    fb.textContent = 'Browserul tau nu suporta notificari push.';
    fb.style.color = '#ff8080';
    return;
  }
  btn.disabled = true;
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      fb.textContent = 'Trebuie sa permiti notificarile din browser ca sa functioneze.';
      fb.style.color = '#ff8080';
      btn.disabled = false;
      return;
    }
    const keyRes = await fetch('/api/push/public-key');
    const keyData = await keyRes.json();
    if (!keyData.publicKey) {
      fb.textContent = 'Notificarile push nu sunt configurate momentan pe server.';
      fb.style.color = '#ff8080';
      btn.disabled = false;
      return;
    }
    const subscription = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(keyData.publicKey),
    });
    const res = await fetch('/api/admin/push-subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(subscription),
    });
    if (res.status === 401) { location.href = '/admin/login.html'; return; }
    fb.textContent = 'Notificarile sunt active! Vei primi alerta pe telefon la fiecare mesaj WhatsApp nou.';
    fb.style.color = '#a4f0bb';
    btn.textContent = 'Notificari active';
  } catch (err) {
    fb.textContent = 'Eroare la activarea notificarilor.';
    fb.style.color = '#ff8080';
    btn.disabled = false;
  }
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredInstallPrompt = e;
  const installBtn = document.getElementById('install-btn');
  if (installBtn) installBtn.style.display = 'inline-block';
});

async function installApp() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  document.getElementById('install-btn').style.display = 'none';
}

load();
setInterval(load, 20000);
</script>
</body>
</html>
