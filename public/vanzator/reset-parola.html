<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seteaza o parola noua - vanzator</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>Seteaza o parola noua</h1>
  <p>Alege o parola noua pentru contul tau de vanzator.</p>
</header>
<main>
  <div class="question-card">
    <div id="feedback"></div>
    <form id="reset-form">
      <label>Parola noua (minim 8 caractere)</label>
      <input type="password" name="password" required minlength="8" style="width:100%;padding:10px;margin:6px 0 18px;border-radius:8px;border:1px solid #2a2e38;background:#10131a;color:#e8eaed;" />
      <button type="submit">Salveaza parola</button>
    </form>
    <p style="text-align:center;margin-top:16px;color:#9aa0ab;font-size:0.9rem;">
      <a href="/vanzator/login.html" style="color:#6c8cff;">Inapoi la autentificare</a>
    </p>
  </div>
</main>
<script>
const token = new URLSearchParams(location.search).get('token');
const form = document.getElementById('reset-form');
const fb = document.getElementById('feedback');
if (!token) {
  fb.innerHTML = '<div class="notice error">Link invalid. Cere din nou resetarea parolei din pagina de autentificare.</div>';
  form.style.display = 'none';
}
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const button = form.querySelector('button');
  button.disabled = true;
  button.textContent = 'Se salveaza...';
  try {
    const res = await fetch('/api/vanzator/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: form.password.value }),
    });
    const data = await res.json();
    if (data.ok) {
      fb.innerHTML = '<div class="notice">Parola a fost schimbata! Te poti autentifica acum.</div>';
      form.style.display = 'none';
    } else {
      fb.innerHTML = `<div class="notice error">${data.error || 'Eroare la resetarea parolei.'}</div>`;
      button.disabled = false;
      button.textContent = 'Salveaza parola';
    }
  } catch (err) {
    fb.innerHTML = '<div class="notice error">Eroare de retea. Incearca din nou.</div>';
    button.disabled = false;
    button.textContent = 'Salveaza parola';
  }
});
</script>
</body>
</html>
