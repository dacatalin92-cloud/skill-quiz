<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panoul meu de vanzator</title>
<link rel="stylesheet" href="/style.css" />
<style>
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .top-bar { max-width:720px; margin: 0 auto; padding: 0 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .top-bar a, .top-bar button { color:#9aa0ab; background:none; border:none; width:auto; padding:6px 10px; }
  .payu-box { background:#171a21; border:1px solid #2a2e38; border-radius:14px; padding:18px 20px; margin-bottom:20px; }
  .product-item { background:#171a21; border:1px solid #2a2e38; border-radius:12px; padding:16px 18px; margin-bottom:12px; }
  .product-item .row button { width:auto; padding:8px 14px; font-size:0.85rem; }
  .badge { display:inline-block; padding:2px 9px; border-radius:20px; font-size:0.75rem; font-weight:600; }
  .badge.on { background:#16301f; color:#a4f0bb; }
  .badge.off { background:#331c1c; color:#ffb3b3; }

  /* Editare produs - modal */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; padding:20px; z-index:100; }
  .modal-overlay.open { display:flex; }
  .modal-card { background:#171a21; border:1px solid #2a2e38; border-radius:14px; padding:22px 24px; max-width:440px; width:100%; max-height:90vh; overflow-y:auto; }
  .modal-card h3 { margin:0 0 16px; }
  .modal-card label { display:block; margin:14px 0 6px; font-size:0.88rem; color:#9aa0ab; }
  .modal-card input[type=text], .modal-card input[type=number], .modal-card textarea, .modal-card input[type=file] {
    width:100%; padding:9px 12px; border-radius:8px; border:1px solid #2a2e38; background:#10131a; color:#e8eaed; font-size:0.88rem; font-family:inherit;
  }
  .modal-card textarea { resize:vertical; min-height:60px; }
  .modal-current-image { margin-top:8px; max-width:140px; max-height:100px; border-radius:8px; border:1px solid #2a2e38; display:block; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
  .modal-actions button { width:auto; padding:9px 16px; }
  .modal-actions .danger-btn { background:#3a1f1f; color:#ffb3b3; }
</style>
</head>
<body>
<div class="top-bar">
  <span style="display:flex;align-items:center;gap:8px;">
    <strong id="seller-name">...</strong>
    <button id="edit-name-btn" style="width:auto;padding:2px 8px;font-size:0.75rem;">Editeaza</button>
  </span>
  <div>
    <a href="/vanzator/comenzi.html" style="color:#6c8cff;font-size:0.9rem;margin-right:14px;">Evidenta achizitiilor</a>
    <button id="logout-btn">Delogare</button>
  </div>
</div>
<header>
  <h1>Panoul meu de vanzator</h1>
</header>
<script src="/common.js"></script>
<main>
  <div id="payu-status" class="payu-box">Se verifica statusul contului de plata...</div>

  <div class="row" style="margin-bottom:16px;">
    <h2 style="margin:0;">Produsele mele</h2>
    <a href="/vanzator/produs-nou.html"><button style="width:auto;padding:10px 16px;">+ Adauga produs</button></a>
  </div>
  <div id="products">Se incarca...</div>
</main>

<div id="product-edit-overlay" class="modal-overlay">
  <div class="modal-card">
    <h3>Editeaza produsul</h3>
    <div id="product-edit-feedback"></div>
    <form id="product-edit-form">
      <input type="hidden" name="productId" />

      <label>Nume produs</label>
      <input type="text" name="name" required />

      <label>Descriere</label>
      <textarea name="description"></textarea>

      <label>Pret per bucata (RON)</label>
      <input type="number" name="priceRon" min="0.01" step="0.01" required />

      <label>Imagine produs</label>
      <img id="product-edit-current-image" class="modal-current-image" style="display:none;" />
      <input type="file" name="image" accept="image/*" />
      <div style="color:#9aa0ab;font-size:0.78rem;margin-top:4px;">Lasa necompletat ca sa pastrezi imaginea actuala. Editarea functioneaza si pentru produsele active.</div>

      <div class="modal-actions">
        <button type="button" id="product-delete-btn" class="danger-btn">Sterge produsul</button>
        <button type="button" id="product-edit-cancel-btn" style="background:transparent;border:1px solid #2a2e38;">Anuleaza</button>
        <button type="submit">Salveaza</button>
      </div>
    </form>
  </div>
</div>

<script>
async function loadMe() {
  const res = await fetch('/api/vanzator/me');
  if (res.status === 401) { location.href = '/vanzator/login.html'; return; }
  const me = await res.json();
  document.getElementById('seller-name').textContent = me.name;

  const box = document.getElementById('payu-status');
  if (!me.payuConfigured) {
    box.innerHTML = '<div class="notice error">PayU nu este configurat pe server (lipsesc cheile din .env) — platile nu vor functiona pana la configurare.</div>';
  } else if (true) {
    box.innerHTML = '<div class="notice success">Contul tau de plata PayU este conectat si verificat. Poti primi bani din vanzari.</div>';
  } else {
    box.innerHTML = `
      <div class="notice error">Contul tau de plata PayU nu este inca conectat/verificat. Produsele tale NU vor fi vizibile public pana finalizezi acest pas.</div>
      <button id="connect-payu" style="margin-top:10px;">Conecteaza-ti contul de plata (PayU)</button>
    `;
    document.getElementById('connect-payu').addEventListener('click', async () => {
      const r = await fetch('/api/vanzator/payu/link');
      const d = await r.json();
      if (d.url) location.href = d.url;
      else alert(d.error || 'Eroare la conectare.');
    });
  }
}

let lastProductsById = {};

async function loadProducts() {
  const res = await fetch('/api/vanzator/produse');
  if (res.status === 401) { location.href = '/vanzator/login.html'; return; }
  const products = await res.json();
  lastProductsById = {};
  products.forEach(p => { lastProductsById[p.id] = p; });
  const el = document.getElementById('products');
  if (!products.length) {
    el.innerHTML = '<p style="color:#9aa0ab;">Nu ai adaugat inca niciun produs.</p>';
    return;
  }
  el.innerHTML = products.map(p => `
    <div class="product-item">
      <div class="row">
        <div>
          <strong>${escapeHtml(p.name)}</strong>
          <span class="badge ${p.active ? 'on' : 'off'}">${p.active ? 'Activ' : 'Dezactivat'}</span>
          <div style="color:#9aa0ab;font-size:0.85rem;margin-top:4px;">
            ${(p.priceBani / 100).toFixed(2)} RON &middot; stoc: ${p.stockRemaining} din ${p.stockTotal} disponibile
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button data-edit-id="${p.id}">Editeaza</button>
          <button data-id="${p.id}" class="toggle-btn">${p.active ? 'Dezactiveaza' : 'Activeaza'}</button>
        </div>
      </div>
    </div>
  `).join('');

  el.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      await fetch(`/api/vanzator/produse/${btn.dataset.id}/toggle`, { method: 'POST' });
      loadProducts();
    });
  });
  el.querySelectorAll('[data-edit-id]').forEach(btn => {
    btn.addEventListener('click', () => openProductEditModal(lastProductsById[btn.dataset.editId]));
  });
}

/* ---------- Editare / stergere produs (permisa si pentru produse active) ---------- */
const productEditOverlay = document.getElementById('product-edit-overlay');
const productEditForm = document.getElementById('product-edit-form');
const productEditFeedback = document.getElementById('product-edit-feedback');
const productEditCurrentImage = document.getElementById('product-edit-current-image');

function openProductEditModal(product) {
  if (!product) return;
  productEditFeedback.innerHTML = '';
  productEditForm.productId.value = product.id;
  productEditForm.name.value = product.name;
  productEditForm.description.value = product.description || '';
  productEditForm.priceRon.value = (product.priceBani / 100).toFixed(2);
  productEditForm.image.value = '';
  if (product.image) {
    productEditCurrentImage.src = product.image;
    productEditCurrentImage.style.display = 'block';
  } else {
    productEditCurrentImage.style.display = 'none';
  }
  productEditOverlay.classList.add('open');
}

function closeProductEditModal() {
  productEditOverlay.classList.remove('open');
}

document.getElementById('product-edit-cancel-btn').addEventListener('click', closeProductEditModal);
productEditOverlay.addEventListener('click', (ev) => { if (ev.target === productEditOverlay) closeProductEditModal(); });

productEditForm.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const id = productEditForm.productId.value;
  const fd = new FormData(productEditForm);
  const saveBtn = productEditForm.querySelector('button[type="submit"]');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Se salveaza...';
  try {
    const res = await fetch(`/api/vanzator/produse/${id}/edit`, { method: 'POST', body: fd });
    const data = await res.json();
    if (data.ok) {
      closeProductEditModal();
      loadProducts();
    } else {
      productEditFeedback.innerHTML = `<div class="notice error">${data.error || 'Eroare la salvare.'}</div>`;
    }
  } catch (err) {
    productEditFeedback.innerHTML = '<div class="notice error">Eroare de retea. Incearca din nou.</div>';
  }
  saveBtn.disabled = false;
  saveBtn.textContent = 'Salveaza';
});

document.getElementById('product-delete-btn').addEventListener('click', async () => {
  const id = productEditForm.productId.value;
  const product = lastProductsById[id];
  if (!product) return;
  const msg = product.orderCount > 0
    ? `"${product.name}" are deja ${product.orderCount} comenzi. Nu poate fi sters efectiv (ar pierde legatura cu comenzile/facturile existente) - va fi arhivat: dezactivat si scos din lista, dar istoricul ramane. Continui?`
    : `Stergi definitiv "${product.name}"? Nu are nicio comanda, asa ca stergerea e completa si ireversibila.`;
  if (!confirm(msg)) return;
  const delBtn = document.getElementById('product-delete-btn');
  delBtn.disabled = true;
  try {
    const res = await fetch(`/api/vanzator/produse/${id}/delete`, { method: 'POST' });
    const data = await res.json();
    if (data.ok) {
      closeProductEditModal();
      loadProducts();
    } else {
      productEditFeedback.innerHTML = `<div class="notice error">${data.error || 'Eroare la stergere.'}</div>`;
    }
  } catch (err) {
    productEditFeedback.innerHTML = '<div class="notice error">Eroare de retea. Incearca din nou.</div>';
  }
  delBtn.disabled = false;
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/vanzator/logout', { method: 'POST' });
  location.href = '/vanzator/login.html';
});

document.getElementById('edit-name-btn').addEventListener('click', async () => {
  const current = document.getElementById('seller-name').textContent;
  const nou = prompt('Numele afisat:', current);
  if (nou == null || !nou.trim() || nou.trim() === current) return;
  const res = await fetch('/api/vanzator/nume', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: nou.trim() }),
  });
  const data = await res.json();
  if (data.ok) {
    document.getElementById('seller-name').textContent = data.name;
  } else {
    alert(data.error || 'Eroare la salvare.');
  }
});

loadMe();
loadProducts();
</script>
</body>
</html>
